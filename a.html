<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>مقص الأكاديمية - تقطيع الصور الاحترافي</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body { font-family: 'Cairo', sans-serif; background-color: #f0f9ff; }
        .drop-zone { border: 4px dashed #3b82f6; transition: all 0.3s ease; position: relative; overflow: hidden; }
        .drop-zone:hover { background-color: #e0f2fe; border-color: #2563eb; transform: scale(1.01); }
        .preview-grid { display: grid; gap: 15px; margin-top: 20px; }
        .card-anim { animation: fadeInUp 0.5s ease forwards; opacity: 0; }
        @keyframes fadeInUp {
            from { opacity: 0; transform: translateY(20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        .shimmer {
            background: linear-gradient(90deg, #eff6ff 25%, #dbeafe 50%, #eff6ff 75%);
            background-size: 200% 100%;
            animation: shimmer-anim 1.5s infinite;
        }
        @keyframes shimmer-anim {
            0% { background-position: 200% 0; }
            100% { background-position: -200% 0; }
        }
    </style>
</head>
<body class="p-4 md:p-8 min-h-screen">

    <div class="max-w-5xl mx-auto">
        <!-- Header -->
        <header class="text-center mb-10">
            <div class="inline-block bg-blue-600 text-white px-6 py-2 rounded-full font-bold text-sm mb-4 shadow-lg shadow-blue-200">
                أكاديمية الأستاذ مصطفى عبد العال دحروج
            </div>
            <h1 class="text-4xl font-black text-blue-900 mb-2 italic">✂️ مِقص الأكاديمية الذكي</h1>
            <p class="text-gray-600 font-bold">قطّع لوحات القصص (Storyboards) إلى صور منفردة بضغطة واحدة!</p>
        </header>

        <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
            <!-- Left Side: Controls -->
            <div class="lg:col-span-1 space-y-6">
                <!-- Drop Area -->
                <div id="drop-area" class="drop-zone bg-white rounded-[2.5rem] p-8 text-center cursor-pointer shadow-xl border-4 border-blue-400">
                    <div class="text-6xl mb-4">🖼️</div>
                    <p class="text-lg font-black text-blue-800">اسحب صورة القصص هنا</p>
                    <p class="text-xs text-gray-400 mt-2 font-bold uppercase">PNG, JPG, WEBP</p>
                    <input type="file" id="file-input" class="hidden" accept="image/*">
                </div>

                <!-- Settings Card -->
                <div id="settings" class="hidden bg-white p-8 rounded-[2.5rem] shadow-xl border-b-8 border-blue-500 card-anim">
                    <h3 class="font-black text-blue-900 mb-6 flex items-center gap-2">
                        <span class="bg-blue-100 p-2 rounded-lg">⚙️</span> إعدادات التقطيع
                    </h3>
                    <div class="space-y-4">
                        <div>
                            <label class="block font-bold text-gray-600 mb-2 mr-2 text-sm">عدد الأعمدة (أفقي)</label>
                            <input type="number" id="cols" value="2" min="1" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 font-bold text-center text-xl transition-all">
                        </div>
                        <div>
                            <label class="block font-bold text-gray-600 mb-2 mr-2 text-sm">عدد الصفوف (رأسي)</label>
                            <input type="number" id="rows" value="4" min="1" class="w-full p-4 bg-slate-50 border-2 border-slate-100 rounded-2xl outline-none focus:border-blue-500 font-bold text-center text-xl transition-all">
                        </div>
                    </div>
                    <button onclick="processImage()" class="w-full mt-8 bg-orange-500 hover:bg-orange-600 text-white font-black py-4 rounded-2xl text-xl shadow-lg shadow-orange-200 transition-all active:scale-95">
                        ابدأ التقطيع السحري ✨
                    </button>
                </div>
            </div>

            <!-- Right Side: Results -->
            <div class="lg:col-span-2">
                <div id="placeholder-msg" class="h-full border-4 border-dashed border-slate-200 rounded-[3rem] flex items-center justify-center text-slate-300 flex-col p-10">
                    <div class="text-8xl mb-4">⚡</div>
                    <p class="text-xl font-black italic">انتظر رفع صورتك للبدء يا بطل!</p>
                </div>

                <div id="result-area" class="hidden">
                    <div class="bg-blue-900 text-white p-6 rounded-t-[2.5rem] flex justify-between items-center shadow-lg">
                        <div>
                            <h3 class="text-xl font-black italic">تم التقطيع بنجاح! 🎉</h3>
                            <p id="stats-msg" class="text-xs opacity-80 font-bold uppercase mt-1"></p>
                        </div>
                        <button onclick="downloadAll()" class="bg-green-500 hover:bg-green-600 text-white px-6 py-3 rounded-xl font-black shadow-lg transition-transform active:scale-95 flex items-center gap-2">
                            <span>حفظ الكل</span>
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="3" d="M4 16v1a3 3 0 003 3h10a3 3 0 003-3v-1m-4-4l-4 4m0 0l-4-4m4 4V4" /></svg>
                        </button>
                    </div>
                    <div id="image-grid" class="bg-white p-6 rounded-b-[2.5rem] shadow-xl preview-grid grid-cols-2 md:grid-cols-3 max-h-[70vh] overflow-y-auto border-x-4 border-b-4 border-slate-50">
                        <!-- Images appear here -->
                    </div>
                </div>
            </div>
        </div>
    </div>

    <canvas id="canvas" class="hidden"></canvas>

    <script>
        const dropArea = document.getElementById('drop-area');
        const fileInput = document.getElementById('file-input');
        const settings = document.getElementById('settings');
        const imageGrid = document.getElementById('image-grid');
        const resultArea = document.getElementById('result-area');
        const placeholder = document.getElementById('placeholder-msg');
        let sourceImage = new Image();

        dropArea.onclick = () => fileInput.click();

        fileInput.onchange = (e) => {
            const file = e.target.files[0];
            if (file) handleFile(file);
        };

        dropArea.ondragover = (e) => { e.preventDefault(); dropArea.classList.add('bg-blue-50'); };
        dropArea.ondragleave = () => { dropArea.classList.remove('bg-blue-50'); };
        dropArea.ondrop = (e) => {
            e.preventDefault();
            const file = e.dataTransfer.files[0];
            if (file) handleFile(file);
        };

        function handleFile(file) {
            const reader = new FileReader();
            reader.onload = (event) => {
                sourceImage.src = event.target.result;
                sourceImage.onload = () => {
                    settings.classList.remove('hidden');
                    placeholder.classList.add('hidden');
                    dropArea.innerHTML = `
                        <div class="relative group">
                            <img src="${sourceImage.src}" class="max-h-64 mx-auto rounded-3xl shadow-md border-4 border-white">
                            <div class="absolute inset-0 bg-blue-600/20 opacity-0 group-hover:opacity-100 transition-opacity rounded-3xl flex items-center justify-center">
                                <span class="bg-white text-blue-600 px-4 py-2 rounded-full font-black shadow-xl">تغيير الصورة</span>
                            </div>
                        </div>
                        <p class="font-black text-green-600 mt-4 italic">تم الرفع! جاهز للتقطيع ✂️</p>
                    `;
                };
            };
            reader.readAsDataURL(file);
        }

        function processImage() {
            const cols = parseInt(document.getElementById('cols').value) || 1;
            const rows = parseInt(document.getElementById('rows').value) || 1;
            const canvas = document.getElementById('canvas');
            const ctx = canvas.getContext('2d');

            imageGrid.innerHTML = '';
            resultArea.classList.remove('hidden');
            placeholder.classList.add('hidden');

            const pieceWidth = sourceImage.width / cols;
            const pieceHeight = sourceImage.height / rows;

            canvas.width = pieceWidth;
            canvas.height = pieceHeight;

            let count = 1;
            for (let y = 0; y < rows; y++) {
                for (let x = 0; x < cols; x++) {
                    ctx.clearRect(0, 0, pieceWidth, pieceHeight);
                    ctx.drawImage(
                        sourceImage, 
                        x * pieceWidth, y * pieceHeight, pieceWidth, pieceHeight, 
                        0, 0, pieceWidth, pieceHeight
                    );

                    const dataUrl = canvas.toDataURL('image/png');
                    const container = document.createElement('div');
                    container.className = 'bg-slate-50 p-3 rounded-3xl border-2 border-slate-100 card-anim relative group';
                    container.style.animationDelay = `${count * 0.05}s`;
                    
                    container.innerHTML = `
                        <div class="absolute top-2 right-2 bg-blue-600 text-white w-6 h-6 rounded-full text-[10px] font-black flex items-center justify-center shadow-md z-10">${count}</div>
                        <div class="overflow-hidden rounded-2xl mb-2 aspect-square bg-white border border-slate-100">
                            <img src="${dataUrl}" class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-500">
                        </div>
                        <a href="${dataUrl}" download="academy_piece_${count}.png" class="block w-full text-center py-2 bg-white hover:bg-blue-50 text-blue-600 font-black rounded-xl text-xs transition-colors border border-blue-100">
                            تحميل ⬇️
                        </a>
                    `;
                    imageGrid.appendChild(container);
                    count++;
                }
            }
            document.getElementById('stats-msg').innerText = `إجمالي عدد الصور: ${count-1} مشهد`;
            window.scrollTo({ top: resultArea.offsetTop - 50, behavior: 'smooth' });
        }

        function downloadAll() {
            const links = imageGrid.querySelectorAll('a');
            if (links.length === 0) return;
            
            links.forEach((link, index) => {
                setTimeout(() => {
                    const clickEvent = new MouseEvent('click');
                    link.dispatchEvent(clickEvent);
                }, index * 250); 
            });
        }
    </script>
</body>
</html>
